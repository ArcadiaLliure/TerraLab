<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>TerraLab Three.js Host</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0d0d1e; }
    #canvas-container { width: 100%; height: 100%; }
    #renderer-status {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #f7d476;
      background: #0d0d1e;
      font: 13px/1.4 sans-serif;
      text-align: center;
      pointer-events: none;
    }
    #renderer-status[data-state="error"] { color: #ff9292; }
    #renderer-status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="renderer-status" role="status">Starting the Three.js renderer…</div>
  <script src="qwebchannel.js"></script>
  <script src="three.min.js"></script>
  <script src="threejs_runner.js"></script>
</body>
</html>
