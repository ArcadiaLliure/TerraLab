[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralab"
version = "0.1.0"
description = "TerraLab: Astrophysical mapping, digital elevation models, and light pollution analysis pipeline"
readme = "README.md"
authors = [
    { name = "TerraLab Contributors" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
keywords = ["astronomy", "gis", "dem", "pyqt", "light-pollution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "PyQt5>=5.15.9,<5.16",
    "PyQtWebEngine>=5.15.7,<5.16",
    "numpy>=1.26,<3",
    "skyfield>=1.46,<2",
    "astropy>=6,<8",
    "rasterio>=1.3.10,<2",
    "pyproj>=3.6,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "Pillow>=10,<12",
    "hpgeom>=1.2,<2",
    "netCDF4>=1.6,<2",
    "cdsapi>=0.7,<1",
    "requests>=2.31,<3",
    "truststore>=0.10.4,<1",
    "tqdm>=4.66,<5",
    "zstandard>=0.23,<1",
    "py7zr>=0.22,<2",
    "timezonefinder>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "coverage>=7,<8",
    "ruff==0.13.2",
    "vulture>=2.11,<3",
    "pyright>=1.1.380,<2",
    "import-linter>=2.1,<3",
    "build==1.5.0",
]
geo = [
    "xarray>=2024.1,<2026",
    "rioxarray",
    "dask[array]>=2024.1,<2026",
]

[project.scripts]
terralab = "TerraLab.__main__:main"
terralab-query-elevation = "TerraLab.cli.query_elevation:main"
terralab-gaia = "TerraLab.cli.gaia:main"
terralab-dvnl-preprocess = "TerraLab.cli.dvnl_preprocess:main"
terralab-dvnl-convolve = "TerraLab.cli.dvnl_convolve:main"
terralab-predict-sqm = "TerraLab.cli.predict_sqm_raster:main"
terralab-calibrate-sqm = "TerraLab.cli.calibrate_sqm:main"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
tmp_path_retention_policy = "failed"

[tool.setuptools.packages.find]
where = ["."]
include = ["TerraLab*"]
exclude = ["tests*", "proves*", "gaia_stars*", "dist*", "build*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
TerraLab = [
    "data/translations.json",
    "data/stars/*.json",
    "terrain/land_cover/legends/*.txt",
    "ui/onboarding/assets/*.html",
    "ui/onboarding/assets/audio/*.mp3",
]

[project.urls]
Homepage = "https://github.com/ArcadiaLliure/TerraLab"
Repository = "https://github.com/ArcadiaLliure/TerraLab"
Issues = "https://github.com/ArcadiaLliure/TerraLab/issues"

