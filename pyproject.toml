[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terralab"
version = "0.1.0"
description = "TerraLab: Astrophysical mapping, digital elevation models, and light pollution analysis pipeline"
readme = "README.md"
authors = [
    { name = "TerraLab Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.9,<5.16",
    "numpy>=1.26,<3",
    "skyfield>=1.46,<2",
    "astropy>=6,<8",
    "rasterio>=1.3.10,<2",
    "pyproj>=3.6,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
    "Pillow>=10,<12",
    "hpgeom>=1.2,<2",
    "netCDF4>=1.6,<2",
    "cdsapi>=0.7,<1",
    "requests>=2.31,<3",
    "tqdm>=4.66,<5",
    "zstandard>=0.23,<1",
    "py7zr>=0.22,<2",
    "timezonefinder>=8.2,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=4,<6",
    "ruff>=0.6,<1",
]
geo = [
    "xarray>=2024.1,<2026",
    "rioxarray",
    "dask[array]>=2024.1,<2026",
]

[project.scripts]
terralab = "TerraLab.__main__:main"
terralab-dvnl-preprocess = "scripts.dvnl_preprocess:main"
terralab-dvnl-convolve = "scripts.dvnl_convolve:main"
terralab-predict-sqm = "scripts.predict_sqm_raster:main"
terralab-calibrate-sqm = "scripts.calibrate_sqm:main"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
tmp_path_retention_policy = "failed"

[tool.setuptools.packages.find]
where = ["."]
include = ["TerraLab*", "scripts*"]
exclude = ["tests*", "proves*", "gaia_stars*", "dist*", "build*"]

